[package]
name = "save-journal-lab"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone verification build for the journaled save scheme.
# Not part of the Then app; kept apart so it builds and runs in seconds.

[dependencies]
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
debug = false
