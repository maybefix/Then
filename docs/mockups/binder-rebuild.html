<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Then バインダー再構築モック</title>
<style>
:root{
  --bg-root:#f3f5f8;--bg-primary:#fff;--bg-secondary:#f5f7fa;--bg-tertiary:#eef1f5;
  --bg-panel:#fff;--bg-panel-strong:#f4f6f9;--border-subtle:#dce1e8;--border-strong:#bcc5d1;
  --text-primary:#172033;--text-secondary:#3d4b61;--text-muted:#6d798c;--text-faint:#929dad;
  --accent:#193a5a;--accent-strong:#0f2c46;--success:#2f7d4a;--warning:#9b6519;--danger:#b64141;
  --accent-soft:rgba(25,58,90,.08);--status-done:#2f7d4a;--status-edit:#9b6519;--status-write:#2b6cb0;
  --ui:"Yu Gothic UI","Segoe UI","Hiragino Sans","Meiryo",sans-serif;
  --mincho:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#d9dee5;font-family:var(--ui);color:var(--text-primary)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}

/* ---- モック用の外枠（アプリ外） ---- */
.harness{position:sticky;top:0;z-index:50;background:#20262f;color:#e9edf2;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 14px;font-size:13px}
.harness b{margin-right:10px;font-weight:600;letter-spacing:.02em}
.harness button{padding:5px 12px;border-radius:6px;color:#c8d0da}
.harness button.on{background:#e9edf2;color:#20262f}
.harness .hint{flex-basis:100%;color:#9aa6b4;font-size:12px;padding:2px 2px 0}
.stage{padding:16px;display:flex;justify-content:center}
.scaler{transform-origin:top left}

/* ---- アプリ本体 ---- */
.app{width:1600px;height:1000px;background:var(--bg-root);display:grid;grid-template-rows:36px 36px 1fr 26px;box-shadow:0 10px 40px rgba(20,30,45,.25);font-size:13px;overflow:hidden}
.ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.topbar{display:flex;align-items:center;padding:0 0 0 12px;background:var(--bg-root);color:var(--text-muted);gap:10px}
.crumbs{display:flex;align-items:center;gap:8px;font-size:12px}
.crumbs .sep{color:var(--text-faint)}
.crumbs .cur{color:var(--text-secondary)}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px}
.mode{display:flex;align-items:center;gap:6px;border:1px solid var(--border-subtle);background:var(--bg-primary);border-radius:6px;padding:3px 8px;color:var(--text-primary);font-size:12px;position:relative}
.mode.open{border-color:var(--text-primary)}
.modeMenu{position:absolute;top:30px;right:0;width:168px;background:var(--bg-primary);border:1px solid var(--border-subtle);border-radius:8px;box-shadow:0 8px 24px rgba(20,30,45,.14);padding:4px;z-index:5;display:none}
.mode.open .modeMenu{display:block}
.modeMenu div{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;color:var(--text-secondary)}
.modeMenu div.on{background:var(--accent-soft);color:var(--text-primary);font-weight:600}
.modeMenu hr{border:0;border-top:1px solid var(--border-subtle);margin:4px 2px}
.winctl{display:flex}
.winctl span{width:46px;height:36px;display:grid;place-items:center;color:var(--text-muted)}
.tabs{display:flex;align-items:stretch;background:var(--bg-root);border-bottom:1px solid var(--border-subtle)}
.tab{display:flex;align-items:center;gap:8px;padding:0 12px;width:210px;font-size:12px;color:var(--text-muted);border-right:1px solid var(--border-subtle)}
.tab.on{background:var(--bg-primary);color:var(--text-primary);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.tab .x{margin-left:auto;color:var(--text-faint)}
.tabs .plus{margin-left:auto;width:36px;display:grid;place-items:center;color:var(--text-muted)}
.main{display:grid;grid-template-columns:44px 320px 1fr 300px;min-height:0}
.activity{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:12px;color:var(--text-muted);border-right:1px solid var(--border-subtle)}
.activity .on{color:var(--text-primary);position:relative}
.activity .on::before{content:"";position:absolute;left:-14px;top:-4px;bottom:-4px;width:2px;background:var(--accent)}
.side{background:var(--bg-root);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border-subtle)}
.sideHead{display:flex;align-items:center;gap:6px;padding:12px 16px 8px 18px;font-size:13px;color:var(--text-secondary)}
.sideHead .meta{margin-left:auto;font-size:11px;color:var(--text-faint);display:flex;gap:12px;align-items:center}
.libRow{margin:4px 8px 8px;display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--border-subtle);border-radius:6px;background:var(--bg-primary);font-size:12px}
.libRow small{margin-left:auto;color:var(--text-faint);font-size:11px}
.tree{flex:1;overflow:auto;padding:0 8px 0 8px;font-size:12px}
.sec{display:flex;align-items:center;gap:6px;padding:10px 8px 4px;color:var(--text-muted);font-size:11px;letter-spacing:.06em}
.sec .n{margin-left:auto;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:5px;color:var(--text-secondary);cursor:pointer;white-space:nowrap}
.row:hover{background:var(--bg-tertiary)}
.row.on{background:var(--bg-tertiary);color:var(--text-primary);box-shadow:inset 2px 0 0 var(--accent)}
.row.ind{padding-left:24px}
.row.ind2{padding-left:40px}
.row .n{margin-left:auto;color:var(--text-faint);font-size:11px;font-variant-numeric:tabular-nums}
.row .glyph{width:14px;text-align:center;color:var(--text-faint);flex:none}
.st{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:3px;font-size:10px;font-weight:700;flex:none}
.st.done{color:var(--status-done)}.st.edit{color:var(--status-edit)}.st.write{color:var(--status-write)}.st.todo{color:var(--text-faint)}
.badge{min-width:18px;height:16px;padding:0 5px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;display:inline-grid;place-items:center;margin-left:auto}
.cp{border-top:1px solid var(--border-subtle);padding:10px 18px 12px;color:var(--text-muted);font-size:12px}
.cp small{display:block;margin-top:8px;color:var(--text-faint);font-size:11px}
.legend{border-top:1px solid var(--border-subtle);padding:8px 14px;font-size:11px;color:var(--text-muted);display:flex;gap:8px}
.legend b{font-weight:700}
.legend .tot{margin-left:auto}
.center{background:var(--bg-primary);min-width:0;min-height:0;position:relative;overflow:hidden}
.rside{background:var(--bg-root);display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--border-subtle)}
.rHead{display:flex;align-items:center;gap:7px;padding:12px 12px 10px 14px;color:var(--text-secondary)}
.rHead .acts{margin-left:auto;display:flex;gap:12px;color:var(--text-muted)}
.rBody{flex:1;overflow:auto;padding:0 12px 16px}
.status{display:flex;align-items:center;gap:14px;padding:0 14px;font-size:11px;color:var(--text-muted);border-top:1px solid var(--border-subtle);background:var(--bg-root)}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--success);display:inline-block;margin-right:6px}
.status .r{margin-left:auto}

/* ---- 投稿ストリーム ---- */
.composer{background:var(--bg-primary);border:1px solid var(--border-subtle);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.composer .ph{color:var(--text-faint);min-height:44px;line-height:1.6}
.composer .bar{display:flex;align-items:center;gap:10px;color:var(--text-muted);border-top:1px solid var(--border-subtle);padding-top:8px;margin-top:4px}
.composer .bar .key{font-size:11px;color:var(--text-faint);margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:6px;background:var(--accent);color:#fff;font-size:12px}
.btn.ghost{background:var(--bg-primary);color:var(--text-secondary);border:1px solid var(--border-subtle)}
.filters{display:flex;gap:6px;margin-bottom:10px}
.chip{padding:3px 10px;border:1px solid var(--border-subtle);border-radius:6px;font-size:11px;color:var(--text-muted);background:var(--bg-primary)}
.chip.on{background:var(--bg-tertiary);color:var(--text-primary);border-color:var(--border-strong)}
.day{font-size:11px;color:var(--text-faint);margin:14px 2px 6px}
.post{position:relative;padding:10px 12px 8px;background:var(--bg-primary);border:1px solid var(--border-subtle);border-radius:8px;margin-bottom:8px}
.post p{margin:0 0 8px;line-height:1.65;color:var(--text-primary);font-size:12.5px}
.post .t{font-size:10.5px;color:var(--text-faint);margin-bottom:4px;display:flex;gap:8px;align-items:center}
.post .acts{display:flex;gap:14px;color:var(--text-muted);font-size:11px;align-items:center}
.post .acts span{display:inline-flex;gap:4px;align-items:center}
.post .acts .promote{margin-left:auto;color:var(--accent);font-weight:600}
.post.reply{margin-left:18px;border-left:2px solid var(--border-strong);border-radius:0 8px 8px 0}
.post.hl{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.linkTag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 6px}

/* ---- 縦書き本文 ---- */
.vert{position:absolute;inset:0;overflow:hidden;display:flex;justify-content:flex-end;padding:96px 120px 70px 40px}
.vert .page{writing-mode:vertical-rl;font-family:var(--mincho);font-size:19px;line-height:2.05;letter-spacing:.06em;color:var(--text-primary);height:100%}
.vert h1{font-size:28px;margin:0 0 0 30px;letter-spacing:.12em;font-weight:600}
.vert p{margin:0;text-indent:1em}
.vert .gutter{position:absolute;top:0;bottom:0;left:50%;border-left:1px solid var(--border-subtle)}
.vert mark{background:transparent;box-shadow:inset -3px 0 0 rgba(25,58,90,.25)}

/* ---- ノート ---- */
.note{position:absolute;inset:0;overflow:auto;padding:52px 0}
.note .doc{max-width:640px;margin:0 auto}
.note .path{font-size:11px;color:var(--text-faint);margin-bottom:10px;display:flex;gap:6px;align-items:center}
.note h1{font-size:26px;margin:0 0 12px;font-weight:600}
.props{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;font-size:12px;color:var(--text-muted);padding:10px 0 14px;border-bottom:1px solid var(--border-subtle);margin-bottom:18px}
.props span:nth-child(even){color:var(--text-secondary)}
.tag{display:inline-block;padding:0 7px;border-radius:4px;background:var(--bg-tertiary);margin-right:4px;font-size:11px}
.note p{font-size:14.5px;line-height:1.95;color:var(--text-primary);margin:0 0 14px}
.wl{color:var(--accent);text-decoration:underline;text-decoration-color:rgba(25,58,90,.35);text-underline-offset:3px}
.quote{border-left:3px solid var(--border-strong);padding:4px 14px;color:var(--text-secondary);font-size:13.5px;line-height:1.8;margin:0 0 14px;background:var(--bg-secondary);border-radius:0 6px 6px 0}
.quote small{display:block;color:var(--text-faint);font-size:10.5px}

/* ---- インスペクタ ---- */
.ins{background:var(--bg-primary);border:1px solid var(--border-subtle);border-radius:8px;margin-bottom:10px}
.ins h4{margin:0;padding:9px 12px 7px;font-size:11px;color:var(--text-muted);font-weight:600;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.ins h4 .n{margin-left:auto;color:var(--text-faint);font-weight:400}
.ins .item{display:flex;gap:8px;align-items:flex-start;padding:7px 12px;border-top:1px solid var(--bg-tertiary);font-size:12px;color:var(--text-secondary);line-height:1.55}
.ins .item .sub{display:block;color:var(--text-faint);font-size:10.5px}
.ins .item svg{margin-top:2px;color:var(--text-muted)}
.ins textarea{width:100%;border:0;border-top:1px solid var(--bg-tertiary);resize:none;font:inherit;font-size:12.5px;line-height:1.7;padding:8px 12px;color:var(--text-primary);background:transparent;height:92px;outline:none}
.seg{display:flex;gap:4px;padding:6px 12px 10px}
.seg span{flex:1;text-align:center;padding:4px 0;border:1px solid var(--border-subtle);border-radius:5px;font-size:11px;color:var(--text-muted)}
.seg span.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.kv{display:flex;justify-content:space-between;padding:6px 12px;font-size:12px;color:var(--text-secondary);border-top:1px solid var(--bg-tertiary)}
.kv span:first-child{color:var(--text-muted)}
.selHead{display:flex;align-items:center;gap:8px;padding:10px 12px}
.selHead strong{font-size:14px}
.selHead small{color:var(--text-faint);font-size:11px;display:block}
.selHead .btn{margin-left:auto}

/* ---- キャンバス ---- */
.board{position:absolute;inset:0;background-color:#f6f7f9;background-image:linear-gradient(var(--border-subtle) 1px,transparent 1px),linear-gradient(90deg,var(--border-subtle) 1px,transparent 1px);background-size:28px 28px}
.boardBar{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:14px;background:var(--bg-primary);border:1px solid var(--border-subtle);border-radius:8px;padding:5px 12px 5px 6px;color:var(--text-muted);z-index:2}
.boardBar .name{border:1px solid var(--border-subtle);border-radius:5px;padding:4px 10px;width:200px;color:var(--text-primary);font-size:12px;background:var(--bg-secondary)}
.boardRight{position:absolute;top:12px;right:14px;display:flex;gap:16px;color:var(--text-muted);background:var(--bg-primary);border:1px solid var(--border-subtle);border-radius:8px;padding:8px 12px;z-index:2}
.grp{position:absolute;border:1px dashed #b9a98f;background:rgba(232,220,200,.45);border-radius:2px}
.grp > span{position:absolute;top:10px;left:12px;font-size:12px;color:#5c4f3c}
.card{position:absolute;background:var(--bg-primary);border:1.5px solid #3a4250;box-shadow:0 8px 18px rgba(20,30,45,.08);padding:12px 14px;font-size:12.5px;line-height:1.75;color:var(--text-primary)}
.card.warm{background:#f2ebe1}
.card strong{display:block;font-size:13px;margin-bottom:6px}
.card .kind{position:absolute;top:-1px;right:-1px;display:flex;align-items:center;gap:4px;font-size:10px;padding:2px 7px;color:#fff;background:#3a4250}
.card.post{border-color:#8794a6;border-style:solid;background:#fbfcfd}
.card.post .kind{background:#8794a6}
.card.scene .kind{background:var(--accent)}
.card.scene{border-color:var(--accent)}
.card.sel{outline:2px solid #2b6cb0;outline-offset:3px}
.card .foot{position:absolute;left:14px;right:14px;bottom:8px;display:flex;gap:8px;font-size:10.5px;color:var(--text-faint)}
.arrow{position:absolute;height:2px;background:#2b3442}
.arrow::after{content:"";position:absolute;right:-1px;top:-5px;border:6px solid transparent;border-left:9px solid #2b3442;border-right:0}
.edgeLabel{position:absolute;font-size:11px;color:var(--text-secondary);background:#f6f7f9;padding:0 4px}
.tools{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:var(--bg-primary);border:1px solid var(--border-subtle);border-radius:10px;padding:5px;box-shadow:0 6px 18px rgba(20,30,45,.08)}
.tools span{display:flex;flex-direction:column;align-items:center;gap:2px;width:58px;padding:5px 0;font-size:10.5px;color:var(--text-muted);border-radius:6px}
.tools span.on{background:var(--accent);color:#fff}
.selbar{position:absolute;display:flex;align-items:center;gap:6px;background:var(--text-primary);color:#fff;border-radius:8px;padding:5px 6px 5px 12px;font-size:12px;box-shadow:0 6px 18px rgba(20,30,45,.2)}
.selbar .btn{background:#fff;color:var(--text-primary)}
.zoom{position:absolute;right:14px;bottom:18px;display:flex;align-items:center;gap:14px;background:var(--bg-primary);border:1px solid var(--border-subtle);border-radius:8px;padding:6px 14px;font-size:11px;color:var(--text-muted)}

/* ---- コルクボード ---- */
.cork{position:absolute;inset:0;overflow:auto;background:var(--bg-secondary);padding:22px 28px}
.corkHead{display:flex;align-items:center;gap:12px;margin-bottom:18px;color:var(--text-muted);font-size:12px}
.corkHead strong{color:var(--text-primary);font-size:15px}
.corkHead .r{margin-left:auto;display:flex;gap:6px}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.icard{background:var(--bg-primary);border:1px solid var(--border-subtle);border-radius:4px;min-height:208px;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(20,30,45,.05);position:relative}
.icard.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.icard header{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #f0c9c3}
.icard header .num{font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums}
.icard header strong{font-size:13px}
.icard header .st{margin-left:auto}
.icard p{margin:0;padding:10px 12px;font-size:12.5px;line-height:1.8;color:var(--text-secondary);flex:1;background-image:repeating-linear-gradient(transparent 0 21.5px,#e6eef6 21.5px 22.5px);background-position:0 9px}
.icard footer{display:flex;gap:10px;align-items:center;padding:7px 12px;font-size:10.5px;color:var(--text-faint);border-top:1px solid var(--bg-tertiary)}
.icard footer .bar{flex:1;height:3px;background:var(--bg-tertiary);border-radius:2px;overflow:hidden}
.icard footer .bar i{display:block;height:100%;background:var(--accent)}
.icard.new{border-style:dashed;background:transparent;box-shadow:none;align-items:center;justify-content:center;color:var(--text-faint);gap:6px;flex-direction:row}
.chapterRule{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--text-muted);letter-spacing:.06em;margin-top:6px}
.chapterRule::after{content:"";flex:1;border-top:1px solid var(--border-subtle)}
</style>
</head>
<body>
<div class="harness">
  <b>バインダー再構築モック</b>
  <button data-s="1">1 投稿する</button>
  <button data-s="2">2 ノートにまとめる</button>
  <button data-s="3">3 ボードで組む</button>
  <button data-s="4">4 コルクボード</button>
  <button data-s="5">5 書く</button>
  <span class="hint" id="note"></span>
</div>
<div class="stage"><div class="scaler" id="scaler">
<div class="app">
  <!-- トップバー -->
  <div class="topbar">
    <svg class="ico" viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
    <div class="crumbs" id="crumbs"></div>
    <div class="right">
      <svg class="ico" viewBox="0 0 16 16"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg>
      <svg class="ico" viewBox="0 0 16 16"><path d="M4 2h8v12l-4-3-4 3z"/></svg>
      <svg class="ico" viewBox="0 0 16 16"><path d="M4 3v10M8 3v10M12 3v4"/></svg>
      <svg class="ico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><circle cx="6" cy="6" r="1"/><circle cx="10" cy="6" r="1"/><circle cx="6" cy="10" r="1"/></svg>
      <svg class="ico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
      <div class="mode" id="mode">
        <span id="modeIcon"></span><span id="modeLabel">本文</span>
        <svg class="ico" style="width:12px" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>
        <div class="modeMenu" id="modeMenu"></div>
      </div>
      <div class="winctl"><span>―</span><span>☐</span><span>✕</span></div>
    </div>
  </div>
  <!-- タブ -->
  <div class="tabs" id="tabs"></div>
  <!-- 本体 -->
  <div class="main">
    <div class="activity">
      <svg class="ico on" viewBox="0 0 16 16"><path d="M3 2h6l4 4v8H3z M9 2v4h4"/></svg>
      <svg class="ico" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <svg class="ico" viewBox="0 0 16 16"><rect x="3" y="2" width="10" height="12" rx="1"/><path d="M5.5 5h5M5.5 8h5M5.5 11h3"/></svg>
      <svg class="ico" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
      <svg class="ico" viewBox="0 0 16 16"><path d="M2 4h4l1.5 1.5H14V13H2z M8 7.5v4M6 9.5h4"/></svg>
    </div>
    <!-- 左：バインダー -->
    <div class="side">
      <div class="sideHead">
        <svg class="ico" viewBox="0 0 16 16"><path d="M3 2h9v12H3z M6 2v12"/></svg>

       <div class="item" data-go="n-letters">${I.note}<span>手紙と伏線<span class="sub">青いインクの封筒…</span></span></div></div>
     <div class="ins"><h4>${I.post}元になった投稿<span class="n">2</span></h4>
       <div class="item" data-go="inbox">${I.post}<span>汐見は「届けたい」と初めて思う。<span class="sub">昨日 21:50</span></span></div>
       <div class="item" data-go="inbox">${I.post}<span>閉局の日に、町じゅうから返事が…<span class="sub">今日 10:42</span></span></div></div>
     <div class="ins"><h4>${I.board}ボード</h4>
       <div class="item" data-go="b-main">${I.board}<span>潮待ち郵便局<span class="sub">一日目｜木箱の発見</span></span></div></div>
     <div class="composer" style="margin-top:4px"><div class="ph" style="min-height:28px">いま思いついたこと</div><div class="bar">${I.post}<span class="key">Ctrl+Alt+I</span><span class="btn">投稿</span></div></div>`,
   status:"709文字"},
};

const GO = {"ms1":5,"ms2":4,"ms3":4,"ms4":4,"n-shiomi":2,"n-akari":2,"n-letters":2,"n-port":2,"f-people":2,"b-main":3,"inbox":1,"all":1};

function render(n){
  const s=S[n];
  document.querySelectorAll(".harness button").forEach(b=>b.classList.toggle("on",b.dataset.s==n));
  document.getElementById("note").textContent=s.note;
  document.getElementById("crumbs").innerHTML=s.crumbs.map((c,i)=>i===s.crumbs.length-1?`<span class="cur">${c}</span>`:`<span>${c}</span><span class="sep">›</span>`).join("");
  document.getElementById("tabs").innerHTML=s.tabs.map(([t,ic,on],i)=>`<div class="tab ${(on||s.tabs.length===1)?'on':''}">${ic}<span>${t}</span><span class="x">×</span></div>`).join("")+`<span class="plus">＋</span>`;
  const [ml,mi]=MODES[s.mode];
  document.getElementById("modeLabel").textContent=ml;
  document.getElementById("modeIcon").innerHTML=mi;
  document.getElementById("modeMenu").innerHTML=MODES.map(([l,ic],i)=>`<div class="${i===s.mode?'on':''}" data-mode="${i}">${ic}${l}</div>`).join("")+`<hr><div>${I.outline}エクスポート</div>`;
  document.getElementById("tree").innerHTML=tree(s.tree);
  document.getElementById("center").innerHTML=s.center;
  document.getElementById("rIcon").innerHTML=s.r[1];
  document.getElementById("rLabel").textContent=s.r[0];
  document.getElementById("rBody").innerHTML=s.right();
  document.getElementById("status").innerHTML=`<span><span class="dot"></span>保存済み</span><span>保存点なし</span><span class="r">${s.status}</span>`;
  location.hash=n;
}
document.addEventListener("click",e=>{
  const h=e.target.closest(".harness button"); if(h){render(+h.dataset.s);return;}
  const md=e.target.closest("[data-mode]"); if(md){render([5,4,3,5][+md.dataset.mode]);return;}
  const m=e.target.closest("#mode"); if(m){m.classList.toggle("open");return;}
  document.getElementById("mode").classList.remove("open");
  const g=e.target.closest("[data-go]"); if(g&&GO[g.dataset.go]) render(GO[g.dataset.go]);
});
function fit(){const w=window.innerWidth-32;const k=Math.min(1,w/1600);const sc=document.getElementById("scaler");sc.style.transform=`scale(${k})`;sc.style.width=1600*k+"px";sc.style.height=1000*k+"px";}
window.addEventListener("resize",fit);fit();
render(+(location.hash.slice(1))||1);
</script>
</body>
</html>
