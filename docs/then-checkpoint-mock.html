<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Then チェックポイント（改）モック</title>
<!--
  Then チェックポイント画面 リデザイン モック（単体で動くHTML）
  - claude.ai の Artifact と同じ画面・同じ挙動を、依存なしの1ファイルに移したもの。
  - データ（SNAPS / DIFFS）はサンプル。実装では既存の保存点・差分処理に置き換える。
  - 状態は state、派生値は derive()、描画は render()、操作は ACTIONS にまとまっている。
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho&display=swap">
<style>
  :root {
    --ink: #1c1c1a;
    --ink-2: #3d3d39;
    --ink-3: #5f5f5a;
    --line: #e4e4e0;
    --line-soft: #efefeb;
    --ground: #f6f6f4;
    --ground-2: #fafaf8;
    --paper: #ffffff;
    --auto: #c2620c;
    --add-bg: #dce9ff; --add-ink: #0f3a8f; --add-line: #6b93e6; --add-num: #1d4ed8;
    --del-bg: #ffe6d1; --del-ink: #7a3300; --del-num: #a24a00;
    --danger: #b42318;
    --sans: 'BIZ UDPGothic', 'Hiragino Sans', 'Yu Gothic UI', Meiryo, sans-serif;
    --serif: 'BIZ UDPMincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  button, select, input { font-family: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--add-num); outline-offset: 2px; }

  .app { min-height: 100vh; display: flex; flex-direction: column; }

  /* ヘッダー */
  .topbar { display: flex; align-items: center; gap: 16px; padding: 10px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .back { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px 0 6px; background: none; border: 0; border-radius: 8px; font-size: 14px; color: var(--ink-2); }
  .topbar h1 { margin: 0; font-size: 17px; font-weight: 700; }

  .layout { display: flex; flex-wrap: wrap; flex: 1; align-items: stretch; }

  /* サイドバー */
  .side { flex: 1 1 300px; min-width: 0; background: var(--ground); border-right: 1px solid var(--line); padding: 20px 16px 32px; display: flex; flex-direction: column; gap: 16px; }
  .side-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px; }
  .side-head h2 { margin: 0; font-size: 15px; }
  .count { font-size: 12px; color: var(--ink-3); }

  .current-card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .current-row { display: flex; align-items: center; gap: 10px; }
  .ring { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--add-num); flex: none; }
  .current-name { font-weight: 700; font-size: 14px; display: block; }
  .current-meta { font-size: 12px; color: var(--ink-3); }
  .create-form { display: flex; flex-direction: column; gap: 8px; }
  .create-form label { font-size: 12px; color: var(--ink-2); }
  .create-form input { min-height: 40px; border: 1px solid #c9c9c3; border-radius: 8px; padding: 0 10px; font-size: 14px; color: var(--ink); background: var(--paper); }
  .row-end { display: flex; gap: 8px; justify-content: flex-end; }

  .btn-outline { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border: 1px solid var(--ink); border-radius: 10px; background: var(--paper); color: var(--ink); font-size: 14px; font-weight: 700; }
  .btn-primary { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 700; }
  .btn-primary.sm { min-height: 40px; padding: 0 16px; font-size: 13px; border-radius: 8px; }
  .btn-ghost { min-height: 40px; padding: 0 14px; border: 0; background: none; color: var(--ink-2); font-size: 13px; border-radius: 8px; }
  .btn-line { min-height: 36px; padding: 0 12px; border: 1px solid #dcdcd6; border-radius: 8px; background: var(--paper); color: var(--ink); font-size: 13px; white-space: nowrap; }
  .btn-icon { width: 44px; height: 44px; border: 1px solid #dcdcd6; border-radius: 10px; background: var(--paper); color: var(--ink); display: flex; align-items: center; justify-content: center; }

  .tools { display: flex; flex-direction: column; gap: 6px; }
  .search { position: relative; }
  .search svg { position: absolute; left: 12px; top: 12px; }
  .search input { width: 100%; min-height: 40px; border: 1px solid #dcdcd6; border-radius: 8px; padding: 0 10px 0 36px; font-size: 13px; background: var(--paper); color: var(--ink); }
  .auto-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); min-height: 36px; padding: 0 4px; }
  .auto-toggle input { width: 16px; height: 16px; margin: 0; }

  .groups { display: flex; flex-direction: column; gap: 16px; }
  .group { display: flex; flex-direction: column; gap: 2px; }
  .group-date { font-size: 12px; color: var(--ink-3); font-weight: 700; padding: 0 10px 4px; }
  .snap { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; border: 0; border-radius: 10px; padding: 10px; color: var(--ink); background: transparent; }
  .snap.is-selected { background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .snap .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink); margin-top: 5px; flex: none; }
  .snap .body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .snap .name { font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
  .snap .meta { font-size: 12px; color: var(--ink-3); }
  .snap .memo { font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
  .snap.auto { align-items: center; min-height: 44px; padding: 0 10px; color: var(--ink-2); }
  .snap.auto .dot { width: 7px; height: 7px; background: var(--auto); margin: 0 1px; }
  .snap.auto .name { font-size: 13px; font-weight: 400; }
  .snap.auto .meta { margin-left: auto; white-space: nowrap; }
  .no-results { margin: 0; padding: 8px 10px; font-size: 13px; color: var(--ink-3); }

  /* 詳細 */
  .main { flex: 999 1 560px; min-width: 0; padding: 28px 32px 56px; }
  .wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  .toast { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; border-radius: 10px; background: #e8f0ff; color: var(--add-ink); font-size: 14px; flex-wrap: wrap; }
  .toast span { flex: 1 1 260px; }
  .toast button { min-height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: #fff; color: var(--add-ink); font-size: 13px; font-weight: 700; }

  .detail-head { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .detail-title { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 320px; }
  .detail-title h2 { margin: 0; font-size: 22px; overflow-wrap: anywhere; }
  .detail-meta { font-size: 13px; color: var(--ink-3); }
  .detail-memo { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); }
  .detail-auto { margin: 4px 0 0; font-size: 13px; color: #7a3d06; }
  .detail-actions { display: flex; gap: 8px; align-items: center; position: relative; }
  .menu { position: absolute; top: 52px; right: 0; z-index: 5; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.10); padding: 6px; display: flex; flex-direction: column; min-width: 200px; }
  .menu button { min-height: 40px; text-align: left; padding: 0 12px; border: 0; background: none; border-radius: 6px; font-size: 14px; color: var(--ink); }
  .menu button:hover { background: var(--ground); }
  .menu .danger { color: var(--danger); }

  .compare-bar { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--ground); border-radius: 12px; }
  .compare-bar label { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; min-width: 0; }
  .compare-bar select { min-height: 40px; max-width: 100%; border: 1px solid #d0d0ca; border-radius: 8px; padding: 0 10px; font-size: 14px; background: var(--paper); color: var(--ink); }
  .seg { display: flex; background: #e6e6e1; border-radius: 9px; padding: 3px; gap: 2px; }
  .seg button { min-height: 36px; padding: 0 14px; border: 0; border-radius: 7px; font-size: 13px; background: transparent; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  .summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
  .summary p { margin: 0; font-size: 16px; font-weight: 700; }
  .summary .dir { font-size: 13px; color: var(--ink-3); }
  .stats { display: flex; gap: 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .summary .stats { margin-left: auto; font-weight: 700; }
  .plus { color: var(--add-num); }
  .minus { color: var(--del-num); }

  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); align-items: center; flex-wrap: wrap; }
  .legend span { display: flex; align-items: center; gap: 6px; }

  del { background: var(--del-bg); color: var(--del-ink); text-decoration-thickness: 1.5px; border-radius: 3px; padding: 2px; }
  ins { background: var(--add-bg); color: var(--add-ink); text-decoration: underline; text-decoration-color: var(--add-line); text-underline-offset: 5px; border-radius: 3px; padding: 2px; }
  .legend del, .legend ins { padding: 1px 4px; text-underline-offset: 3px; }

  .files { display: flex; flex-direction: column; gap: 12px; }
  .file { border: 1px solid var(--line); border-radius: 12px; background: var(--paper); overflow: hidden; }
  .file-head { display: flex; align-items: center; gap: 8px 12px; padding: 6px 10px 6px 4px; flex-wrap: wrap; }
  .file-toggle { flex: 1 1 300px; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 44px; background: none; border: 0; padding: 0 8px; text-align: left; color: var(--ink); }
  .file-toggle svg { flex: none; transition: transform .15s ease; }
  .file-toggle[aria-expanded="false"] svg { transform: rotate(-90deg); }
  .file-name { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
  .file-folder { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #ecece8; color: var(--ink-2); white-space: nowrap; }
  .badge.add { background: var(--add-bg); color: var(--add-ink); }

  .side-head-row { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); border-top: 1px solid var(--line-soft); background: var(--ground-2); font-size: 12px; font-weight: 700; color: var(--ink-2); }
  .side-head-row div { padding: 8px 18px; }
  .side-head-row div:first-child { border-right: 1px solid var(--line-soft); }

  .order { border-top: 1px solid var(--line-soft); padding: 14px 20px; display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 8px 12px; font-size: 14px; }
  .order .k { color: var(--ink-3); font-size: 12px; padding-top: 2px; }
  .add-note { border-top: 1px solid var(--line-soft); padding: 14px 20px; font-size: 13px; color: var(--ink-2); }

  .hunk { border-top: 1px solid var(--line-soft); }
  .gap { padding: 5px 20px 5px 62px; font-size: 12px; color: var(--ink-3); background: var(--ground-2); border-bottom: 1px solid #f1f1ed; }
  .inline-row { display: grid; grid-template-columns: 52px minmax(0,1fr); padding: 14px 24px 16px 0; }
  .ln { text-align: right; padding-right: 14px; color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 6px; }
  .prose { margin: 0; font-family: var(--serif); font-size: 16px; line-height: 2; }
  .side-row { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); }
  .side-col { padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 4px; }
  .side-col:first-child { border-right: 1px solid var(--line-soft); }
  .side-col .ln { text-align: left; padding: 0; }
  .side-col .prose { font-size: 15px; line-height: 1.95; }
  .missing { margin: 0; font-size: 13px; color: var(--ink-3); }

  .unchanged { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border: 1px dashed #d0d0ca; border-radius: 12px; font-size: 13px; color: var(--ink-3); }
  .empty { padding: 40px 16px; text-align: center; border: 1px dashed #d0d0ca; border-radius: 12px; color: var(--ink-2); font-size: 14px; }
  .footnote { margin: 4px 0 0; font-size: 12px; color: var(--ink-3); }

  /* 確認ダイアログ */
  .overlay { position: fixed; inset: 0; background: rgba(20,20,18,.38); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 20; }
  .dialog { background: var(--paper); border-radius: 14px; max-width: 460px; width: 100%; padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.20); }
  .dialog h3 { margin: 0; font-size: 18px; overflow-wrap: anywhere; }
  .dialog p { margin: 0; font-size: 14px; line-height: 1.8; }
  .dialog .safe { font-size: 13px; line-height: 1.7; color: var(--ink-2); background: var(--ground); border-radius: 8px; padding: 10px 12px; }
  .dialog .row-end { margin-top: 4px; }
  .dialog .btn-ghost { min-height: 44px; padding: 0 16px; font-size: 14px; }
  .dialog .btn-primary { padding: 0 22px; }

  @media (prefers-reduced-motion: reduce) { .file-toggle svg { transition: none; } }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   サンプルデータ（実装時は既存の保存点データに置き換える）
   ============================================================ */
const SNAPS = [
  { id: 's1', name: '20260804_野球関連増えた', auto: false, date: '8月4日', time: '08:03', files: 8, chars: '27,003', memo: '' },
  { id: 's2', name: '復元前の退避', auto: true, date: '7月10日', time: '09:54', files: 3, chars: '11,402', memo: '' },
  { id: 's3', name: 'テスト検証用', auto: false, date: '7月10日', time: '07:29', files: 3, chars: '11,574', memo: 'テスト検証用です' },
  { id: 's4', name: 'スナップショット検証用です', auto: false, date: '7月2日', time: '20:44', files: 8, chars: '8,386', memo: 'スナップショット検証用です' },
  { id: 's5', name: '復元前の退避', auto: true, date: '7月2日', time: '20:25', files: 7, chars: '8,120', memo: '' },
  { id: 's6', name: '復元前の退避', auto: true, date: '7月2日', time: '20:25', files: 8, chars: '8,402', memo: '' },
  { id: 's7', name: 'とりあえず手動でとってみた', auto: false, date: '7月2日', time: '12:46', files: 7, chars: '8,360', memo: 'メモを入れるテスト' }
];

/* 差分のサンプル。segs は [種別, 文字列]。 s=共通 / d=旧にだけある / a=新にだけある */
const DIFFS = {
  's1:current': {
    summary: '2ファイルの本文と、フォルダの並び順が変わっています',
    plus: '+184字', minus: '−41字', unchanged: 6,
    files: [
      { id: 'f1', name: 'Thenを紹介する記事（仮）.txt', folder: '01_記事', kind: '変更', plus: '+142', minus: '−38', hunks: [
        { ln: '33', gap: '32段落 変更なし', segs: [['s', '今後は'], ['d', 'ルビや傍点に対応していく予定です。'], ['a', 'ルビと傍点に対応したうえで、縦中横の自動判定にも手をつける予定です。']] },
        { ln: '41', gap: '7段落 変更なし', segs: [['s', '気になる点があれば、'], ['d', 'コメント欄'], ['a', 'GitHubのIssue'], ['s', 'で気軽に教えてください。']] }
      ] },
      { id: 'f2', name: '甲子園2026.txt', folder: '03_野球', kind: '変更', plus: '+42', minus: '−3', hunks: [
        { ln: '12', gap: '11段落 変更なし', segs: [['s', '準々決勝は'], ['d', '3試合'], ['a', '4試合すべて'], ['s', 'が1点差の展開になった。'], ['a', '最後の一球まで目が離せない夏だった。']] }
      ] },
      { id: 'f3', name: 'フォルダの並び順', folder: '', kind: '並び順', isOrder: true,
        orderBefore: '01_記事 → 02_メモ → 03_野球 → 04_素材', orderAfter: '01_記事 → 03_野球 → 02_メモ → 04_素材' }
    ]
  },
  's1:prev': {
    summary: '5ファイルが加わり、1ファイルの本文が変わっています',
    plus: '+15,610字', minus: '−12字', unchanged: 2,
    files: [
      { id: 'p6', name: 'Thenを紹介する記事（仮）.txt', folder: '01_記事', kind: '変更', plus: '+20', minus: '−12', hunks: [
        { ln: '8', gap: '7段落 変更なし', segs: [['s', '開発期間はだいたい1ヶ月くらい？　です。最初はCodex一本足打法でしたが'], ['d', '途中から'], ['a', 'すぐに足りなくなって'], ['s', 'Claude Codeを採用しました。']] }
      ] },
      { id: 'p1', name: '甲子園2026.txt', folder: '03_野球', kind: '追加', plus: '+6,210', hunks: [
        { ln: '1', gap: '', segs: [['a', '# 甲子園2026 観戦メモ']] },
        { ln: '2', gap: '', segs: [['a', '[本文の冒頭がここに表示されます]']] }
      ] },
      { id: 'p2', name: '本家の駒大コンテンツ.txt', folder: '03_野球', kind: '追加', plus: '+4,883', addNote: '新しく加わったファイルです。' },
      { id: 'p3', name: '夏の大会メモ.txt', folder: '03_野球', kind: '追加', plus: '+2,140', addNote: '新しく加わったファイルです。' },
      { id: 'p4', name: '球場めぐり.txt', folder: '03_野球', kind: '追加', plus: '+1,197', addNote: '新しく加わったファイルです。' },
      { id: 'p5', name: 'スコアの付け方.txt', folder: '04_素材', kind: '追加', plus: '+1,180', addNote: '新しく加わったファイルです。' }
    ]
  }
};

function genericDiff(snap) {
  return {
    summary: '1ファイルの本文が変わっています',
    plus: '+58字', minus: '−12字', unchanged: Math.max(snap.files - 1, 0),
    files: [
      { id: 'g1', name: 'Thenを紹介する記事（仮）.txt', folder: '01_記事', kind: '変更', plus: '+58', minus: '−12', hunks: [
        { ln: '5', gap: '4段落 変更なし', segs: [['s', 'Windows環境において縦書きができるフリーのテキストエディタは'], ['d', 'ほとんどありません'], ['a', '少ないです'], ['s', '。']] }
      ] }
    ]
  };
}

/* ============================================================
   状態
   ============================================================ */
const state = {
  sel: 's1',          // 選択中の保存点
  compare: 'current', // 'current' | 'prev' | 保存点ID
  view: 'inline',     // 'inline'（変わった所だけ） | 'side'（左右に並べる）
  showAuto: true,     // 自動退避を一覧に出すか
  q: '',              // 絞り込み
  open: {},           // ファイルカードの開閉 { [diffKey:fileId]: bool }
  creating: false, draft: '',
  menu: false,
  confirm: null,      // { scope: 'all' | 'file' | 'order', target?: string }
  toast: '',
  extra: []           // 画面上で作成・自動退避された保存点（先頭に追加）
};

function setState(patch) { Object.assign(state, patch); render(); }

/* ============================================================
   派生値
   ============================================================ */
function derive() {
  const all = state.extra.concat(SNAPS);
  const snap = all.find(s => s.id === state.sel) || all[0];
  const idx = all.indexOf(snap);
  const prev = all[idx + 1] || null;
  let compare = state.compare;
  if (compare === 'prev' && !prev) compare = 'current';
  const stamp = s => s.date + ' ' + s.time;

  // 一覧（日付でグループ化）
  const q = state.q.trim();
  const visible = all.filter(s =>
    (state.showAuto || !s.auto || s.id === snap.id) &&
    (!q || s.name.includes(q) || (s.memo || '').includes(q)));
  const groups = [];
  visible.forEach(s => {
    let g = groups[groups.length - 1];
    if (!g || g.date !== s.date) { g = { date: s.date, items: [] }; groups.push(g); }
    g.items.push(s);
  });

  // 比較先の選択肢
  const opts = [{ value: 'current', label: '現在のプロジェクト' }];
  if (prev) opts.push({ value: 'prev', label: 'ひとつ前の保存点（' + stamp(prev) + '）' });
  all.forEach(s => {
    if (s.id !== snap.id && (!prev || s.id !== prev.id)) opts.push({ value: s.id, label: s.name + '（' + stamp(s) + '）' });
  });

  // 比較の向き
  const target = compare === 'current' ? null : (compare === 'prev' ? prev : all.find(s => s.id === compare));
  const targetOlder = !!target && all.indexOf(target) > idx;
  let oldLabel, newLabel, oldSide, newSide;
  if (!target) {
    oldLabel = 'この保存点（' + stamp(snap) + '）'; newLabel = '現在のプロジェクト'; oldSide = '保存点'; newSide = '現在';
  } else if (targetOlder) {
    oldLabel = target.name + '（' + stamp(target) + '）'; newLabel = 'この保存点（' + stamp(snap) + '）'; oldSide = '比較先'; newSide = 'この保存点';
  } else {
    oldLabel = 'この保存点（' + stamp(snap) + '）'; newLabel = target.name + '（' + stamp(target) + '）'; oldSide = 'この保存点'; newSide = '比較先';
  }

  // 差分
  const key = snap.id + ':' + (compare === 'current' || compare === 'prev' ? compare : 'other');
  const diff = (snap.isNew && compare === 'current')
    ? { summary: '変更はありません', plus: '', minus: '', unchanged: 0, files: [], empty: true }
    : (DIFFS[key] || genericDiff(snap));

  return { all, snap, prev, compare, stamp, groups, opts, oldLabel, newLabel, oldSide, newSide, key, diff };
}

/* ============================================================
   描画
   ============================================================ */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const ICON = {
  back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  plus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  search: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5f5f5a" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>',
  restore: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5v5h5"/><path d="M4.6 14.5A8 8 0 1 0 6 7.2L4 10"/></svg>',
  more: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>',
  chevron: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5f5f5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
  check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>'
};

function segHTML(segs) {
  return segs.map(([k, s]) => k === 'd' ? '<del>' + esc(s) + '</del>' : k === 'a' ? '<ins>' + esc(s) + '</ins>' : '<span>' + esc(s) + '</span>').join('');
}

function renderSidebar(d) {
  const createArea = state.creating
    ? `<div class="create-form">
         <label for="snap-name">保存点の名前</label>
         <input id="snap-name" type="text" data-input="draft" value="${esc(state.draft)}" placeholder="例：第2稿に入る前">
         <div class="row-end">
           <button class="btn-ghost" data-act="cancelCreate">やめる</button>
           <button class="btn-primary sm" data-act="saveCreate">保存する</button>
         </div>
       </div>`
    : `<button class="btn-outline" data-act="startCreate">${ICON.plus}今の状態を保存点にする</button>`;

  const autoCount = d.all.filter(s => s.auto).length;

  const groups = d.groups.map(g => `
    <div class="group">
      <div class="group-date">${esc(g.date)}</div>
      ${g.items.map(s => {
        const on = s.id === d.snap.id;
        if (s.auto) {
          return `<button class="snap auto${on ? ' is-selected' : ''}" data-act="pick" data-id="${s.id}" aria-current="${on}">
            <span class="dot"></span><span class="name">${esc(s.name)}</span>
            <span class="meta">${esc(s.time)} · ${s.files}ファイル</span></button>`;
        }
        return `<button class="snap${on ? ' is-selected' : ''}" data-act="pick" data-id="${s.id}" aria-current="${on}">
          <span class="dot"></span>
          <span class="body">
            <span class="name">${esc(s.name)}</span>
            <span class="meta">${esc(s.time)} · ${s.files}ファイル · ${esc(s.chars)}字</span>
            ${s.memo ? `<span class="memo">${esc(s.memo)}</span>` : ''}
          </span></button>`;
      }).join('')}
    </div>`).join('');

  return `
  <aside class="side">
    <div class="side-head"><h2>保存点</h2><span class="count">${d.all.length}件</span></div>
    <div class="current-card">
      <div class="current-row"><span class="ring"></span>
        <div><span class="current-name">現在のプロジェクト</span><span class="current-meta">8ファイル · 27,145字</span></div>
      </div>
      ${createArea}
    </div>
    <div class="tools">
      <div class="search">${ICON.search}
        <input id="snap-search" type="search" data-input="q" aria-label="名前・メモで絞り込む" placeholder="名前・メモで絞り込む" value="${esc(state.q)}">
      </div>
      <label class="auto-toggle"><input type="checkbox" data-change="showAuto" ${state.showAuto ? 'checked' : ''}>自動退避も表示（${autoCount}件）</label>
    </div>
    <nav class="groups" aria-label="保存点の一覧">
      ${groups || '<p class="no-results">一致する保存点はありません</p>'}
    </nav>
  </aside>`;
}

function renderFile(f, i, d) {
  const k = d.key + ':' + f.id;
  const isOpen = Object.prototype.hasOwnProperty.call(state.open, k) ? state.open[k] : i === 0;
  const side = state.view === 'side';
  const hunks = f.hunks || [];

  let body = '';
  if (isOpen) {
    if (side && !f.isOrder && hunks.length) {
      body += `<div class="side-head-row"><div>${esc(d.oldLabel)}</div><div>${esc(d.newLabel)}</div></div>`;
    }
    if (f.isOrder) {
      body += `<div class="order"><span class="k">${esc(d.oldLabel)}</span><span>${esc(f.orderBefore)}</span>
               <span class="k">${esc(d.newLabel)}</span><span>${esc(f.orderAfter)}</span></div>`;
    }
    if (f.addNote) body += `<div class="add-note">${esc(f.addNote)}（${esc(f.plus)}字）</div>`;
    body += hunks.map(h => {
      const gap = h.gap ? `<div class="gap">⋯ ${esc(h.gap)}</div>` : '';
      if (!side) {
        return `<div class="hunk">${gap}<div class="inline-row"><span class="ln">${esc(h.ln)}</span><p class="prose">${segHTML(h.segs)}</p></div></div>`;
      }
      const oldSegs = h.segs.filter(x => x[0] !== 'a');
      const newSegs = h.segs.filter(x => x[0] !== 'd');
      return `<div class="hunk">${gap}<div class="side-row">
        <div class="side-col"><span class="ln">${esc(h.ln)}</span>${oldSegs.length ? `<p class="prose">${segHTML(oldSegs)}</p>` : '<p class="missing">（この時点ではまだありません）</p>'}</div>
        <div class="side-col"><span class="ln">${esc(h.ln)}</span><p class="prose">${segHTML(newSegs)}</p></div>
      </div></div>`;
    }).join('');
  }

  return `
  <section class="file">
    <div class="file-head">
      <button class="file-toggle" data-act="toggleFile" data-key="${esc(k)}" data-open="${isOpen}" aria-expanded="${isOpen}">
        ${ICON.chevron}
        <span class="file-name">${esc(f.name)}</span>
        ${f.folder ? `<span class="file-folder">${esc(f.folder)}</span>` : ''}
        <span class="badge${f.kind === '追加' ? ' add' : ''}">${esc(f.kind)}</span>
      </button>
      ${(f.plus || f.minus) ? `<span class="stats"><span class="plus">${esc(f.plus || '')}</span><span class="minus">${esc(f.minus || '')}</span></span>` : ''}
      <button class="btn-line" data-act="restoreFile" data-scope="${f.isOrder ? 'order' : 'file'}" data-target="${esc(f.name)}">${f.isOrder ? '並び順だけ戻す' : 'このファイルだけ戻す'}</button>
    </div>
    ${body}
  </section>`;
}

function renderMain(d) {
  const s = d.snap;
  const diff = d.diff;
  return `
  <main class="main"><div class="wrap">
    ${state.toast ? `<div class="toast" role="status"><span>${esc(state.toast)}直前の状態は「復元前の退避」として保存してあります。</span><button data-act="closeToast">閉じる</button></div>` : ''}

    <div class="detail-head">
      <div class="detail-title">
        <h2>${esc(s.name)}</h2>
        <div class="detail-meta">${esc(d.stamp(s))} · ${s.files}ファイル · ${esc(s.chars)}字</div>
        ${s.memo ? `<p class="detail-memo">${esc(s.memo)}</p>` : ''}
        ${s.auto ? '<p class="detail-auto">復元を実行する直前に、自動で作られた保存点です。</p>' : ''}
      </div>
      <div class="detail-actions">
        <button class="btn-primary" data-act="restoreAll">${ICON.restore}この時点に戻す</button>
        <button class="btn-icon" data-act="toggleMenu" aria-label="その他の操作" aria-expanded="${state.menu}">${ICON.more}</button>
        ${state.menu ? `<div class="menu">
          <button data-act="toggleMenu">名前とメモを編集</button>
          <button data-act="toggleMenu">この保存点を書き出す</button>
          <button class="danger" data-act="toggleMenu">この保存点を削除</button>
        </div>` : ''}
      </div>
    </div>

    <div class="compare-bar">
      <label>比較先
        <select data-change="compare">
          ${d.opts.map(o => `<option value="${esc(o.value)}"${o.value === d.compare ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}
        </select>
      </label>
      <div class="seg" role="group" aria-label="差分の表示方法">
        <button data-act="setView" data-view="inline" aria-pressed="${state.view === 'inline'}">変わった所だけ</button>
        <button data-act="setView" data-view="side" aria-pressed="${state.view === 'side'}">左右に並べる</button>
      </div>
    </div>

    <div class="summary">
      <p>${esc(diff.summary)}</p>
      <span class="dir">${esc(d.oldLabel)} → ${esc(d.newLabel)}</span>
      <span class="stats"><span class="plus">${esc(diff.plus)}</span><span class="minus">${esc(diff.minus)}</span></span>
    </div>

    ${diff.files.length ? `<div class="legend">
      <span><del>消えた文</del>${esc(d.oldSide)}にだけある</span>
      <span><ins>加わった文</ins>${esc(d.newSide)}にだけある</span>
    </div>` : ''}

    <div class="files">
      ${diff.files.map((f, i) => renderFile(f, i, d)).join('')}
      ${(diff.unchanged > 0 && !diff.empty) ? `<div class="unchanged">${ICON.check}<span>変更のないファイル ${diff.unchanged}件は省略しています</span></div>` : ''}
      ${diff.empty ? '<div class="empty">比較先と同じ内容です。戻しても何も変わりません。</div>' : ''}
      <p class="footnote">戻すときは、直前の状態を「復元前の退避」として自動で保存します。</p>
    </div>
  </div></main>`;
}

function renderConfirm(d) {
  const c = state.confirm;
  if (!c) return '';
  const s = d.snap, at = d.stamp(s);
  let title, body;
  if (c.scope === 'all') {
    title = '「' + s.name + '」の時点に戻す';
    body = s.files + 'ファイルの本文と、フォルダの並び順を ' + at + ' の状態に戻します。';
  } else if (c.scope === 'order') {
    title = 'フォルダの並び順だけ戻す';
    body = '本文には手を触れず、フォルダの並び順だけを ' + at + ' の状態に戻します。';
  } else {
    title = '「' + c.target + '」だけ戻す';
    body = 'このファイルの本文を ' + at + ' の状態に戻します。ほかのファイルはそのままです。';
  }
  return `
  <div class="overlay">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="cf-title">
      <h3 id="cf-title">${esc(title)}</h3>
      <p>${esc(body)}</p>
      <p class="safe">今の状態は「復元前の退避」として自動で保存されるので、あとから元に戻せます。</p>
      <div class="row-end">
        <button class="btn-ghost" data-act="cancelConfirm">キャンセル</button>
        <button class="btn-primary" data-act="doRestore" id="confirm-ok">戻す</button>
      </div>
    </div>
  </div>`;
}

function render() {
  // 入力中のフォーカスとキャレットを保つ
  const active = document.activeElement;
  const focusId = active && active.id;
  const caret = active && 'selectionStart' in active ? active.selectionStart : null;

  const d = derive();
  document.getElementById('app').innerHTML = `
  <div class="app">
    <header class="topbar">
      <button class="back">${ICON.back}本文へ戻る</button>
      <h1>チェックポイント</h1>
    </header>
    <div class="layout">${renderSidebar(d)}${renderMain(d)}</div>
    ${renderConfirm(d)}
  </div>`;

  if (state.confirm) {
    document.getElementById('confirm-ok').focus();
  } else if (focusId) {
    const el = document.getElementById(focusId);
    if (el) { el.focus(); if (caret !== null && el.setSelectionRange) try { el.setSelectionRange(caret, caret); } catch (e) {} }
  }
}

/* ============================================================
   操作
   ============================================================ */
const ACTIONS = {
  pick: el => setState({ sel: el.dataset.id, menu: false, compare: 'current' }),
  startCreate: () => { setState({ creating: true, draft: '' }); document.getElementById('snap-name').focus(); },
  cancelCreate: () => setState({ creating: false }),
  saveCreate: () => {
    const id = 'n' + Date.now();
    const snap = { id, name: state.draft.trim() || '名前のない保存点', auto: false, date: '今日', time: 'たった今', files: 8, chars: '27,145', memo: '', isNew: true };
    setState({ creating: false, extra: [snap].concat(state.extra), sel: id, compare: 'current', toast: '' });
  },
  toggleMenu: () => setState({ menu: !state.menu }),
  setView: el => setState({ view: el.dataset.view }),
  toggleFile: el => setState({ open: Object.assign({}, state.open, { [el.dataset.key]: el.dataset.open !== 'true' }) }),
  restoreAll: () => setState({ confirm: { scope: 'all' }, menu: false }),
  restoreFile: el => setState({ confirm: { scope: el.dataset.scope, target: el.dataset.target }, menu: false }),
  cancelConfirm: () => setState({ confirm: null }),
  doRestore: () => {
    const d = derive(), c = state.confirm;
    const backup = { id: 'r' + Date.now(), name: '復元前の退避', auto: true, date: '今日', time: 'たった今', files: 8, chars: '27,145', memo: '' };
    const msg = c.scope === 'all' ? '「' + d.snap.name + '」の時点に戻しました。'
      : c.scope === 'order' ? 'フォルダの並び順を戻しました。'
      : '「' + c.target + '」を戻しました。';
    setState({ confirm: null, extra: [backup].concat(state.extra), toast: msg });
  },
  closeToast: () => setState({ toast: '' })
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && ACTIONS[el.dataset.act]) ACTIONS[el.dataset.act](el);
});
// 日本語入力の変換中は再描画しない（IMEが壊れるため）。名前入力は描画に影響しないので値だけ保持する。
function onTextInput(el) {
  const key = el.dataset.input;
  if (!key) return;
  if (key === 'draft') state.draft = el.value;
  else setState({ [key]: el.value });
}
document.addEventListener('input', e => { if (!e.isComposing) onTextInput(e.target); });
document.addEventListener('compositionend', e => onTextInput(e.target));
document.addEventListener('change', e => {
  const key = e.target.dataset.change;
  if (key === 'showAuto') setState({ showAuto: e.target.checked });
  if (key === 'compare') setState({ compare: e.target.value });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.confirm) setState({ confirm: null });
  if (e.key === 'Enter' && e.target.id === 'snap-name') ACTIONS.saveCreate();
});

render();
</script>
</body>
</html>
